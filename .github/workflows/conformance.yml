# Provider conformance gate.
#
# Proves this provider still implements the two-layer polyglot contract from
# std::polyglot::core against the current Mezze toolchain: every WasmForeign
# verb, both numeric constructors, and the `impl Result WasmForeign` mirror must
# compile (the runtime-free `mez check` gate in conformance/check.sh, backed by
# the toolchain's #22 foreign-kind gate).
#
# There is no published `mez` binary yet, so the toolchain is built from source
# (GraalVM CE 25, as the mezze repo requires). Once a binary is released, replace
# the build step with a download and this gets much faster.
#
# The behavioural layer (mez dev, needs GraalWasm) is left opt-in via
# MEZ_CONFORMANCE_BEHAVIOURAL=1 to keep the gate fast and runtime-independent.
name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this provider
        uses: actions/checkout@v4

      - name: Check out the Mezze toolchain
        uses: actions/checkout@v4
        with:
          repository: mezze-lang/mezze
          ref: main
          path: mezze

      - name: Set up GraalVM CE 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the mez toolchain
        working-directory: mezze
        run: ./gradlew --no-daemon :cli:installDist :cli:installRuntime

      - name: Run the conformance gate (mez check)
        env:
          MEZ: ${{ github.workspace }}/mezze/cli/build/install/mez/bin/mez
        run: ./conformance/check.sh
